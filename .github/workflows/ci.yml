name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Show MoonBit toolchain
        run: moon version --all

      - name: Check Code Formatting
        run: moon fmt --check

      - name: Check Interface Files
        run: moon info

      - name: Run Project Typecheck
        run: moon check --deny-warn

      - name: Execute Full Test Suite
        run: moon test --deny-warn

      - name: Check All Targets
        run: moon check --target all

      - name: Test All Targets
        run: moon test --target all

      - name: Build All Targets
        run: moon build --target all

      - name: Build CLI Application
        run: moon run src/cli
